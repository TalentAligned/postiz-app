[build]
builder = "DOCKERFILE"
# NOTE: "Dockerfile.dev" is a misleading name inherited from upstream Postiz.
# It is actually the production build Dockerfile (pnpm install, pnpm build,
# nginx + pm2). It produces a full production image, not a development one.
dockerfilePath = "Dockerfile.dev"

[deploy]
healthcheckPath = "/api"
healthcheckTimeout = 300
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[phases.setup]
nixPkgs = ['nodejs', 'python3']
aptPkgs = ['build-essential', 'libudev-dev']
